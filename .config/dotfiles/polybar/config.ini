[colors]
bg = #F6F0E4
fg = #2A2B42
accent = #C5C0B6
muted = #D5CFC5
urgent = #C83B3B


[bar/paper]
bottom = true
width = 100%
height = 22pt
radius = 0
monitor = HDMI-A-0


background = ${colors.bg}
foreground = ${colors.fg}

line-size = 2pt
line-color = ${colors.accent}

border-top-size = 1pt
border-top-color = #83807B

padding-left = 5
padding-right = 5
module-margin = 2

font-0 = Inter:style=Bold:size=10;2
font-1 = Inter:style=Bold:size=10;2

modules-left = i3 date
modules-right = cpu pulseaudio

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

# --- MODULES CONFIG ---

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
strip-wsnumbers = true
index-sort = true

# Active Workspace (Indigo Ink Accent + Bold EB Garamond)
label-focused = %name%
label-focused-foreground = #000000
label-focused-background = ${colors.accent}
label-focused-padding = 3
label-focused-font = 2

# Inactive Workspaces (Regular EB Garamond)
label-unfocused = %name%
label-unfocused-foreground = ${colors.muted}
label-unfocused-padding = 3
label-unfocused-font = 1

# Visible / Urgent Workspaces
label-urgent = %name%
label-urgent-foreground = ${colors.bg}
label-urgent-background = ${colors.urgent}
label-urgent-padding = 3
label-urgent-font = 2

[module/pulseaudio]
type = internal/pulseaudio
format-volume = VOL <label-volume>
label-volume = %percentage%%
label-volume-foreground = ${colors.fg}
label-volume-font = 2

label-muted = MUTED
label-muted-foreground = ${colors.urgent}
label-muted-font = 2

[module/date]
type = internal/date
interval = 1.0

time = %H:%M

label = %date%  %time%
label-font = 2
label-foreground = ${colors.fg}

[module/cpu]
type = internal/cpu
format = CPU <label>
label = %percentage%%
; Seconds to sleep between updates
; Default: 1
interval = 0.5

; Default: 80
; New in version 3.6.0
warn-percentage = 95

