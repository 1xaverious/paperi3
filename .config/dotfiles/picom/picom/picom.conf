# --- Backend ---
backend = "glx";
vsync = true;

# --- Animations (FTLabs / Jonaburg Features) ---
animations = true;
animation-stiffness = 200;
animation-window-mass = 0.5;
animation-dampening = 16;
animation-clipping-percentage = 0.8;

# Tipe animasi pas window buka/tutup/switch
animation-for-open-window = "zoom";
animation-for-unmap-window = "zoom";
animation-for-workspace-switch-in = "slide-in-left";
animation-for-workspace-switch-out = "slide-right";

blur-background-exclude = [
  "class_g = 'Polybar'",
  "window_type = 'dock'"
];


# --- Fading ---
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 5;

shadow = true;
shadow-radius = 32;
shadow-opacity = 0.40;
shadow-offset-x = -30;
shadow-offset-y = -24;
